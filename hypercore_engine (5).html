        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ===== PERSISTENT STORAGE LAYER =====
        const STORAGE_KEY = 'hypercore_state_v5';
        const STORAGE_VERSION = 5;
        const AI_CACHE_KEY = 'hypercore_ai_cache_v5';

        const storage = {
            load() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    const data = JSON.parse(raw);
                    if (data.__version !== STORAGE_VERSION) return null;
                    return data;
                } catch (err) { return null; }
            },
            save(state) {
                try {
                    const payload = { ...state, __version: STORAGE_VERSION, __savedAt: Date.now() };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                    return true;
                } catch (err) { return false; }
            },
            clear() {
                try { localStorage.removeItem(STORAGE_KEY); return true; } catch (err) { return false; }
            },
            exportAll() {
                return localStorage.getItem(STORAGE_KEY) || JSON.stringify({ __version: STORAGE_VERSION });
            }
        };

        // Offline-friendly AI response cache (Neo-Nexus addition)
        const aiCache = {
            _read() { try { return JSON.parse(localStorage.getItem(AI_CACHE_KEY) || '{}'); } catch (e) { return {}; } },
            _write(data) { try { localStorage.setItem(AI_CACHE_KEY, JSON.stringify(data)); } catch (e) {} },
            get(key) {
                const all = this._read();
                const entry = all[key];
                if (!entry) return null;
                if (Date.now() - entry.t > 7 * 24 * 3600 * 1000) {
                    delete all[key]; this._write(all); return null;
                }
                return entry.v;
            },
            set(key, value) {
                const all = this._read();
                all[key] = { t: Date.now(), v: value };
                const keys = Object.keys(all);
                if (keys.length > 50) keys.sort((a, b) => all[a].t - all[b].t).slice(0, keys.length - 50).forEach(k => delete all[k]);
                this._write(all);
            }
        };

        // ===== CODE CONTEXT ANALYZER =====
        const analyzeCode = (code) => {
            if (!code || typeof code !== 'string') return { isEmpty: true, length: 0, lines: 0, type: 'unknown', libraries: [], features: [], colorPalette: [], summary: 'Empty buffer' };
            const lower = code.toLowerCase();
            const lines = code.split('\n').length;
            const libraries = [];
            const features = [];

            if (lower.includes('three.min.js') || /\bthree\./i.test(code)) libraries.push('Three.js');
            if (lower.includes('cdn.tailwindcss.com') || /class="[^"]*\b(flex|grid|bg-|text-)/i.test(code)) libraries.push('Tailwind CSS');
            if (lower.includes('react.production')) libraries.push('React');
            if (lower.includes('d3.min.js')) libraries.push('D3.js');
            if (lower.includes('gsap')) libraries.push('GSAP');

            if (lower.includes('<canvas')) features.push('canvas');
            if (lower.includes('webgl')) features.push('webgl');
            if (lower.includes('@keyframes')) features.push('animations');
            if (lower.includes('backdrop-filter')) features.push('glassmorphism');
            if (lower.includes('fetch(')) features.push('network');

            const colorPalette = [...new Set(colorMatches.map(c => c.toLowerCase()))].slice(0, 8);

            if (libraries.includes('Three.js')) type = 'webgl-scene';
            else if (libraries.includes('React')) type = 'react-app';
            else if (features.includes('canvas')) type = 'canvas-graphic';

                for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);

            const [toastMsg, setToastMsg] = useState('');
            const [isAgentOpen, setIsAgentOpen] = useState(false);
            const [mobileMenu, setMobileMenu] = useState(false);
            const [networkOnline, setNetworkOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);

            // Audio Reference
            const [activeAudio, setActiveAudio] = useState(null);
            const [audioLoading, setAudioLoading] = useState(false);
            const [selectedVoice, setSelectedVoice] = useState("Kore");

            // Confirmation Modal
            const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
            const triggerConfirmation = (title, message, onConfirm) => {
                setConfirmModal({ isOpen: true, title, message, onConfirm });
            };

            // ---- PERSISTENT STATES ----
            const [projects, setProjects] = useState(() => persisted?.projects || [
                { id: 'p_default', name: 'main_kernel', content: DEFAULT_THREE_CODE, createdAt: Date.now(), updatedAt: Date.now() }
            ]);
            const [currentProjectId, setCurrentProjectId] = useState(() => persisted?.currentProjectId || 'p_default');
            const currentProject = projects.find(p => p.id === currentProjectId) || projects[0];
            const [code, setCode] = useState(() => currentProject?.content || DEFAULT_THREE_CODE);
            const [codeHistory, setCodeHistory] = useState([]);

            const [modules, setModules] = useState(() => persisted?.modules || [
                { id: 'm1', type: 'UI', name: 'Glass Card', content: '<div class="glass-xray border border-[rgba(0,229,255,0.20)] p-6 rounded-2xl">{{content}}</div>', tags: ['ui', 'card'], description: 'Frosted glass card container.', params: ['content'], createdAt: Date.now() }
            ]);

            // Neo-Nexus Forge States
            const [tools, setTools] = useState(() => persisted?.tools || buildSeedTools());
            const [toolVault, setToolVault] = useState(() => persisted?.toolVault || []);
            const [forgeToasts, setForgeToasts] = useState([]);

            const [settings, setSettings] = useState(() => persisted?.settings || {
                aiAssistant: true, geminiModel: 'gemini-2.5-flash-preview-09-2025', deepThinking: true, grounding: false,
                structuredOutput: true, e2eEncryption: true, autoFormat: true, autoSave: true, dynamicChips: true, conversationMemory: true
            });

            const [conversations, setConversations] = useState(() => persisted?.conversations || { code: [], debug: [], design: [], architect: [] });
            const [actionLog, setActionLog] = useState(() => persisted?.actionLog || []);

            const [dynamicChips, setDynamicChips] = useState(() => {
                const analysis = analyzeCode(currentProject?.content || DEFAULT_THREE_CODE);
                return getStaticChips(analysis).map(c => ({ ...c, dynamic: false }));
            });
            const [chipsLoading, setChipsLoading] = useState(false);

            const showToast = (msg) => { setToastMsg(msg); setToastOpen(true); };
            const codeAnalysis = useMemo(() => analyzeCode(code), [code]);

            useEffect(() => {
                if (activeAudio) { activeAudio.pause(); setActiveAudio(null); }
            }, [currentProjectId, activeTab]);

            useEffect(() => {
                const goOnline = () => setNetworkOnline(true);
                const goOffline = () => setNetworkOnline(false);
                window.addEventListener('online', goOnline);
                window.addEventListener('offline', goOffline);
                return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
            }, []);

            // Auto-Save
            useEffect(() => {
                if (!isAuthenticated) return;
                const id = setTimeout(() => {
                    storage.save({
                        projects, currentProjectId, modules, settings,
                        tools, toolVault, // Including Forge state
                        conversations: settings.conversationMemory ? conversations : { code: [], debug: [], design: [], architect: [] },
                        actionLog: actionLog.slice(0, 50)
                    });
                }, 400);
                return () => clearTimeout(id);
            }, [projects, currentProjectId, modules, settings, tools, toolVault, conversations, actionLog, isAuthenticated]);

            useEffect(() => {
                if (!settings.autoSave || !isAuthenticated) return;
                const id = setTimeout(() => {
                    setProjects(prev => prev.map(p => p.id === currentProjectId ? { ...p, content: code, updatedAt: Date.now() } : p));
                }, 800);
                return () => clearTimeout(id);
            }, [code, currentProjectId, settings.autoSave, isAuthenticated]);

            useEffect(() => {
                if (!isAuthenticated || !settings.dynamicChips) return;
                let cancelled = false;
                const id = setTimeout(async () => {
                    setChipsLoading(true);
                    const chips = await generateContextualChips(code, codeAnalysis, actionLog);
                    if (!cancelled) { setDynamicChips(chips); setChipsLoading(false); }
                }, 1500);
                return () => { cancelled = true; clearTimeout(id); setChipsLoading(false); };
            }, [code, isAuthenticated, settings.dynamicChips]);

            const updateCodeWithHistory = (newCodeOrFn, actionLabel) => {
                setCode(prevCode => {
                    const newCode = typeof newCodeOrFn === 'function' ? newCodeOrFn(prevCode) : newCodeOrFn;
                    setCodeHistory(h => [prevCode, ...h].slice(0, 20));
                    return newCode;
                });
                if (actionLabel) setActionLog(prev => [actionLabel, ...prev].slice(0, 50));
            };

            const triggerUndo = () => {
                if (codeHistory.length > 0) {
                    setCode(codeHistory[0]); setCodeHistory(prev => prev.slice(1)); showToast("Reverted last AI modification");
                }
            };

            const playIntelligenceBriefing = async () => {
                if (activeAudio) { activeAudio.pause(); setActiveAudio(null); showToast("Audio Briefing Paused"); return; }
                setAudioLoading(true); showToast("Generating intelligence briefing...");
                try {
                    const payload = { contents: [{ parts: [{ text: `Analyze this code context: [${codeAnalysis.summary}]. Write a concise, 1-2 sentence futuristic sci-fi narrator walkthrough.` }] }] };
                    const textResult = await callGeminiWithBackoff(payload);
                    const briefText = textResult.candidates?.[0]?.content?.parts?.[0]?.text || "Initialization complete.";
                    const voiceBase64 = await callGeminiTTS(`Say in a professional futuristic tone: ${briefText}`, selectedVoice);
                    setActiveAudio(playPCM16(voiceBase64, 24000));
                    showToast("Voiced broadcast active");
                } catch (err) {
                    showToast("Audio transmission failed: " + err.message);
                } finally { setAudioLoading(false); }
            };

            const createProject = (name, initialContent) => {
                const id = 'p_' + Date.now();
                const proj = { id, name: name || 'untitled', content: initialContent || '<!DOCTYPE html>\n<html>\n<body>\n  <h1>Hello</h1>\n</body>\n</html>', createdAt: Date.now(), updatedAt: Date.now() };
                setProjects(prev => [proj, ...prev]); setCurrentProjectId(id); setCode(proj.content); setCodeHistory([]);
                showToast(`Project "${proj.name}" created`);
                return id;
            };

            const loadProject = (id) => {
                const p = projects.find(x => x.id === id); if (!p) return;
                setProjects(prev => prev.map(x => x.id === currentProjectId ? { ...x, content: code, updatedAt: Date.now() } : x));
                setCurrentProjectId(id); setCode(p.content); setCodeHistory([]); showToast(`Loaded "${p.name}"`);
            };

            const deleteProject = (id) => {
                if (projects.length === 1) { showToast('At least one project must remain'); return; }
                const remaining = projects.filter(p => p.id !== id);
                setProjects(remaining);
                if (currentProjectId === id) { setCurrentProjectId(remaining[0].id); setCode(remaining[0].content); setCodeHistory([]); }
                showToast('Project deleted');
            };

            const forceSave = () => {
                setProjects(prev => prev.map(p => p.id === currentProjectId ? { ...p, content: code, updatedAt: Date.now() } : p));
                showToast('Project saved to local vault');
            };

            useEffect(() => {
                if (toastOpen) { const timer = setTimeout(() => setToastOpen(false), 3000); return () => clearTimeout(timer); }
            }, [toastOpen]);

            // Keyboard Shortcuts
            useEffect(() => {
                if (!isAuthenticated) return;
                const onKey = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); forceSave(); }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && activeTab === 'ide') {
                        const target = e.target; if (target && (target.tagName === 'TEXTAREA' || target.tagName === 'INPUT')) return;
                        e.preventDefault(); triggerUndo();
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [isAuthenticated, code, codeHistory, activeTab, projects, currentProjectId]);

            // ---- Forge Toast Management ----
            const forgeToastTimers = useRef({});
            const removeForgeToast = (id) => {
                if (forgeToastTimers.current[id]) { clearTimeout(forgeToastTimers.current[id]); delete forgeToastTimers.current[id]; }
                setForgeToasts(prev => prev.filter(t => t.id !== id));
            };
            const clearAllForgeToasts = () => {
                Object.values(forgeToastTimers.current).forEach(clearTimeout); forgeToastTimers.current = {}; setForgeToasts([]);
            };
            const pauseForgeToast = (id) => {
                if (forgeToastTimers.current[id]) { clearTimeout(forgeToastTimers.current[id]); delete forgeToastTimers.current[id]; }
            };
            const resumeForgeToast = (id) => {
                forgeToastTimers.current[id] = setTimeout(() => removeForgeToast(id), 2000);
            };
            const pushForgeToast = (tool, copied = false) => {
                const id = Date.now() + Math.random();
                const newToast = { ...tool, id, copied, paused: false };
                setForgeToasts(prev => [newToast, ...prev].slice(0, 4));
                forgeToastTimers.current[id] = setTimeout(() => removeForgeToast(id), copied ? 4500 : 3500);
                if (copied) {
                    setTimeout(() => setForgeToasts(prev => prev.map(t => t.id === id ? { ...t, copied: false } : t)), 1800);
                }
            };
            const copyForgeSnippet = (tool) => {
                try {
                    navigator.clipboard.writeText(tool.snippet);
                    setForgeToasts(prev => prev.map(t => t.id === tool.id ? { ...t, copied: true } : t));
                    setTimeout(() => setForgeToasts(prev => prev.map(t => t.id === tool.id ? { ...t, copied: false } : t)), 1800);
                    setActionLog(prev => [`Copied snippet: ${tool.name}`, ...prev].slice(0, 50));
                } catch (e) {}
            };


            const TABS = [
                { id: 'dashboard', icon: 'dashboard', label: 'System' },
                { id: 'ide',       icon: 'code',      label: 'IDE' },
                { id: 'preview',   icon: 'eye',       label: 'Preview' },
                { id: 'modules',   icon: 'layers',    label: 'Modules' },
                { id: 'forge',     icon: 'zap',       label: 'Forge' }, // ADDED NEO-NEXUS TAB
                { id: 'settings',  icon: 'settings',  label: 'Config' }
            ];

            return (
                <div className="h-screen w-full text-slate-300 flex flex-col font-sans selection:bg-cyan-500/30 overflow-hidden relative xray-grid">
                    {isAuthenticated && <div className="scan-line" />}

                    {!isAuthenticated ? (
                        <AuthPage onLogin={() => { setIsAuthenticated(true); showToast("Access Granted"); }} hasVault={!!persisted} />
                    ) : (
                        <div className="flex-grow flex flex-col h-full w-full overflow-hidden">
                            {/* === X-RAY HEADER === */}
                            <header className="glass-xray skeletal-border border-x-0 border-t-0 safe-top safe-x shrink-0 z-[60] relative">
                                <div className="flex items-center justify-between px-4 sm:px-6 h-16">
                                    <div className="flex items-center gap-3 min-w-0">
                                        <div className="w-10 h-10 bg-cyan-500 angular-cut flex items-center justify-center text-black glow-cyan cursor-pointer hover:rotate-6 transition-all shrink-0">
                                            <Icon name="binary" size={20} />
                                        </div>
                                        <div className="flex flex-col min-w-0">
                                            <span className="text-base sm:text-lg font-black tracking-tighter text-white uppercase italic leading-none truncate">
                                                Hyper<span className="text-cyan-400 glow-text">Core</span>
                                            </span>
                                            <span className="text-[8px] tracking-[0.35em] text-cyan-500/70 font-bold uppercase mt-0.5 mono">X-RAY ENGINE v6.9</span>
                                        </div>
                                        <div className="hidden lg:flex items-center gap-2 ml-4 px-3 py-1.5 bg-black/40 border border-cyan-500/15 angular-cut-sm">
                                            <Icon name="folder" size={11} className="text-cyan-400" />
                                            <span className="text-[9px] font-bold text-cyan-200/80 uppercase tracking-widest truncate max-w-[160px] mono">{currentProject?.name || 'untitled'}</span>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-2 sm:gap-3">
                                        {!networkOnline && (
                                            <span className="hidden sm:flex items-center gap-1 text-[9px] uppercase tracking-widest text-rose-400 font-bold mono">
                                                <Icon name="wifiOff" size={11} /> OFFLINE
                                            </span>
                                        )}

                                        <div className="hidden md:flex items-center gap-2 bg-black/40 border border-cyan-500/20 angular-cut-sm px-2 py-1">
                                            <select value={selectedVoice} onChange={(e) => setSelectedVoice(e.target.value)} className="bg-transparent text-[9px] font-black uppercase text-cyan-300/80 focus:outline-none cursor-pointer mono">
                                                <option value="Kore" className="bg-black">Kore</option>
                                                <option value="Fenrir" className="bg-black">Fenrir</option>
                                                <option value="Zephyr" className="bg-black">Zephyr</option>
                                            </select>
                                            <button onClick={playIntelligenceBriefing} disabled={audioLoading} className={`flex items-center gap-1.5 text-[10px] font-bold uppercase py-0.5 px-2 angular-cut-sm transition-all ${activeAudio ? 'bg-rose-950 text-rose-300' : 'text-cyan-300 hover:bg-cyan-500/15 hover:text-cyan-100'}`}>
                                                {audioLoading ? <Icon name="loader" size={11} /> : <Icon name="volume" size={11} />}
                                                {activeAudio ? 'Stop' : '✨ Narrate'}
                                            </button>
                                        </div>

                                        <button onClick={() => setIsAgentOpen(!isAgentOpen)} className={`tap-target hidden sm:flex px-3 py-2 angular-cut-sm text-[10px] font-black uppercase tracking-[0.2em] border transition-all items-center gap-2 ${isAgentOpen ? 'bg-cyan-500 border-cyan-400 text-black glow-cyan' : 'border-cyan-500/30 text-cyan-300 hover:text-cyan-100 hover:bg-cyan-500/10'}`}>
                                            <Icon name="sparkles" size={12} /> Intel Hub
                                        </button>
                                        <button onClick={() => setIsAuthenticated(false)} className="hidden sm:block text-[10px] font-bold text-cyan-500/70 hover:text-cyan-200 uppercase tracking-widest transition-colors">
                                            Logout
                                        </button>
                                        <button onClick={() => setMobileMenu(!mobileMenu)} className="tap-target sm:hidden text-cyan-300 flex items-center justify-center">
                                            <Icon name={mobileMenu ? 'x' : 'menu'} size={22} />
                                        </button>
                                    </div>
                                </div>

                                {/* Mobile menu */}
                                {mobileMenu && (
                                    <div className="sm:hidden border-t border-cyan-500/20 fade-in">
                                        <div className="px-4 py-3 grid grid-cols-2 gap-2">
                                            {TABS.map(t => (
                                                <button key={t.id} onClick={() => { setActiveTab(t.id); setMobileMenu(false); }} className={`tap-target px-3 py-3 text-[10px] font-black uppercase tracking-widest flex items-center gap-2 angular-cut-sm transition-all ${activeTab === t.id ? 'bg-cyan-500 text-black' : 'bg-black/40 border border-cyan-500/20 text-cyan-300'}`}>
                                                    <Icon name={t.icon} size={12} /> {t.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </header>

                            {/* === X-RAY TAB BAR === */}
                            <div className="hidden sm:flex items-center px-4 gap-2 glass-xray border-b border-cyan-500/20 shrink-0 z-50 overflow-x-auto safe-x">
                                {TABS.map(t => (
                                    <TabTrigger key={t.id} value={t.id} activeTab={activeTab} setActiveTab={setActiveTab} icon={t.icon} label={t.label} />
                                ))}
                                <div className="ml-auto flex items-center gap-1 text-[9px] text-cyan-500/60 mono uppercase tracking-widest pr-2">
                                    <div className={`w-1.5 h-1.5 rounded-full ${networkOnline ? 'bg-cyan-400 animate-pulse' : 'bg-rose-500'}`} />
                                    HC-{activeTab.toUpperCase()}
                                </div>
                            </div>

                            <main className="flex-1 relative overflow-hidden flex">
                                <div className="flex-1 h-full overflow-hidden">
                                    {activeTab === 'dashboard' && (
                                        <DashboardPage
                                            projects={projects} currentProjectId={currentProjectId}
                                            loadProject={loadProject} createProject={createProject} deleteProject={deleteProject} renameProject={renameProject} duplicateProject={duplicateProject}
                                            setActiveTab={setActiveTab} codeAnalysis={codeAnalysis} modulesCount={modules.length} showToast={showToast} triggerConfirmation={triggerConfirmation}
                                        />
                                    )}
                                    {activeTab === 'ide' && (
                                        <IDEPage
                                            code={code} setCode={setCode} applyAICode={(c, label) => updateCodeWithHistory(c, label)}
                                            showToast={showToast} settings={settings} triggerUndo={triggerUndo} hasHistory={codeHistory.length > 0}
                                            dynamicChips={dynamicChips} chipsLoading={chipsLoading} codeAnalysis={codeAnalysis}
                                            forceSave={forceSave} actionLog={actionLog} currentProject={currentProject} onActionLog={(a) => setActionLog(prev => [a, ...prev].slice(0, 50))}
                                            playBriefing={playIntelligenceBriefing} audioLoading={audioLoading} activeAudio={activeAudio}
                                        />
                                    )}
                                    {activeTab === 'preview' && <PreviewPage code={code} />}
                                    {activeTab === 'modules' && (
                                        <ModuleBuilder
                                            modules={modules} setModules={setModules} showToast={showToast}
                                            applyAICode={(c, label) => updateCodeWithHistory(c, label)} setActiveTab={setActiveTab} code={code} triggerConfirmation={triggerConfirmation}
                                        />
                                    )}
                                    {activeTab === 'forge' && (
                                        <ForgePage
                                            tools={tools} setTools={setTools} vault={toolVault} setVault={setToolVault}
                                            pushToast={pushForgeToast} showToast={showToast} networkOnline={networkOnline}
                                            actionLog={actionLog} setActionLog={(fn) => setActionLog(prev => fn(prev).slice(0, 50))} triggerConfirmation={triggerConfirmation}
                                        />
                                    )}
                                    {activeTab === 'settings' && (
                                        <SettingsPage
                                            settings={settings} setSettings={setSettings} showToast={showToast} projects={projects} modules={modules} conversations={conversations}
                                            tools={tools} toolVault={toolVault} triggerConfirmation={triggerConfirmation}
                                            onClearVault={() => {
                                                triggerConfirmation('Clear Vault Data', 'Erase ALL local data (projects, modules, tools, conversations)? This action cannot be undone.', () => { storage.clear(); showToast('Local vault cleared — reload to apply changes'); });
                                            }}
                                            onClearAllConversations={() => { setConversations({ code: [], debug: [], design: [], architect: [] }); showToast('Conversation memory cleared'); }}
                                        />
                                    )}
                                </div>

                                {/* Intelligence Sidebar */}
                                <AgentSidebar
                                    isOpen={isAgentOpen} onClose={() => setIsAgentOpen(false)} code={code}
                                    applyAICode={(c, label) => updateCodeWithHistory(c, label)} showToast={showToast} settings={settings}
                                    codeAnalysis={codeAnalysis} conversations={conversations} appendConversation={(key, entry) => {
                                        if (settings.conversationMemory) setConversations(prev => ({ ...prev, [key]: [...(prev[key] || []), entry].slice(-20) }));
                                    }}
                                    clearConversation={(key) => setConversations(prev => ({ ...prev, [key]: [] }))} actionLog={actionLog} selectedVoice={selectedVoice}
                                />
                            </main>

                            <footer className="glass-xray skeletal-border border-x-0 border-b-0 safe-bottom safe-x shrink-0">
                                <div className="h-10 px-4 sm:px-6 flex items-center justify-between text-[9px] font-bold uppercase tracking-[0.25em] text-cyan-500/70 mono">
                                    <div className="flex items-center gap-3 sm:gap-4">
                                        <span className="flex items-center gap-2"><div className={`w-1.5 h-1.5 rounded-full ${networkOnline ? 'bg-cyan-400 animate-xray' : 'bg-rose-500'}`} /> Multicore</span>
                                        <span className="hidden sm:flex items-center gap-2"><div className="w-1.5 h-1.5 bg-cyan-300 rounded-full" /> {settings.geminiModel}</span>
                                        <span className="hidden md:flex items-center gap-2"><div className="w-1.5 h-1.5 bg-emerald-400 rounded-full" /> {codeAnalysis.type} · {codeAnalysis.lines}L</span>
                                    </div>
                                    <span className="truncate text-cyan-600">VAULT · {projects.length} PROJ · {modules.length} MOD · {tools.length} TLS</span>
                                </div>
                            </footer>
                        </div>
                    )}
                    <Toast message={toastMsg} isOpen={toastOpen} onClose={() => setToastOpen(false)} />
                    <ForgeToastStack
                        toasts={forgeToasts}
                        removeToast={removeForgeToast}
                        clearAllToasts={clearAllForgeToasts}
                        copySnippet={copyForgeSnippet}
                        pauseToast={pauseForgeToast}
                        resumeToast={resumeForgeToast}
                    />

                    {/* CONFIRMATION MODAL */}
                    {confirmModal.isOpen && (
                        <div className="fixed inset-0 modal-backdrop z-[300] flex items-center justify-center p-4 fade-in font-sans safe-x">
                            <div className="glass-xray skeletal-border angular-cut w-full max-w-md p-6 shadow-2xl glow-cyan relative overflow-hidden">
                                <div className="scan-line" />
                                <h3 className="text-sm font-black uppercase tracking-[0.2em] text-cyan-50 mb-2 flex items-center gap-2 glow-text">
                                    <Icon name="alert" size={16} className="text-cyan-400" />
                                    {confirmModal.title || 'System Confirmation'}
                                </h3>
                                <p className="text-xs text-cyan-100/60 mb-6 leading-relaxed">{confirmModal.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setConfirmModal({ ...confirmModal, isOpen: false })} className="tap-target text-[10px] font-bold uppercase tracking-widest text-cyan-500/70 hover:text-cyan-100 px-4 py-2">Abort</button>
                                    <button
                                        onClick={() => { if (confirmModal.onConfirm) confirmModal.onConfirm(); setConfirmModal({ ...confirmModal, isOpen: false }); }}
                                        className="tap-target bg-rose-700 hover:bg-rose-600 text-white px-5 py-2 angular-cut-sm text-[10px] font-bold uppercase tracking-widest"
                                    >Execute</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ===== COMPONENT: FORGE PAGE (NEO-NEXUS INTEGRATION) =====
        function ForgePage({ tools, setTools, vault, setVault, pushToast, showToast, networkOnline, actionLog, setActionLog, triggerConfirmation }) {
            const [forgeTab, setForgeTab] = useState('directory');
            const [search, setSearch] = useState('');
            const [activeCategory, setActiveCategory] = useState('All Assets');
            const [forgeOpen, setForgeOpen] = useState(false);
            const [forgeBusy, setForgeBusy] = useState(false);
            const abortRef = useRef(null);

            useEffect(() => () => { if (abortRef.current) abortRef.current.abort(); }, []);

            const logAction = (label) => { setActionLog(prev => [{ t: Date.now(), label }, ...prev]); };

            const onTapTool = (tool) => {
                try { navigator.clipboard.writeText(tool.snippet); } catch (e) {}
                pushToast(tool, true);
                logAction(`Extracted snippet: ${tool.name}`);
            };

            const onLongPressTool = (tool) => {
                if (vault.find(v => v.id === tool.id)) {
                    setVault(v => v.filter(x => x.id !== tool.id));
                    logAction(`Unpinned tool: ${tool.name}`);
                } else {
                    setVault(v => [tool, ...v]);
                    logAction(`Pinned tool to vault: ${tool.name}`);
                }
            };

            const filtered = useMemo(() => {
                let list = tools;
                if (activeCategory !== 'All Assets') list = list.filter(t => t.category === activeCategory);
                if (search.trim()) {
                    const q = search.toLowerCase();
                    list = list.filter(t => t.name.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || (t.tags || []).some(tag => tag.toLowerCase().includes(q)));
                }
                return list;
            }, [tools, search, activeCategory]);

            const deleteTool = (tool) => {
                triggerConfirmation('Purge Tool', `Permanently remove "${tool.name}" from the directory?`, () => {
                    setTools(prev => prev.filter(t => t.id !== tool.id));
                    setVault(prev => prev.filter(t => t.id !== tool.id));
                    logAction(`Purged tool: ${tool.name}`);
                });
            };

            const executeForge = async (cfg) => {
                setForgeBusy(true); logAction(`Forging new tool: "${cfg.idea}"`);
                if (abortRef.current) abortRef.current.abort();
                const controller = new AbortController(); abortRef.current = controller;

                try {

                        <div className="flex items-center gap-4 shrink-0">
                            <span className="text-[10px] text-gray-500 uppercase font-black tracking-widest italic">Core Code Buffer</span>
                            {hasHistory && <button onClick={triggerUndo} className="flex items-center gap-1 text-[9px] bg-red-950/40 hover:bg-red-900/60 border border-red-900/50 text-red-400 px-2 py-0.5 rounded transition-all"><Icon name="undo" size={10} /> Undo AI Action</button>}
                            <span className="hidden md:inline text-[9px] text-gray-600 mono">{codeAnalysis.summary}</span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0 ml-4">
                            <button onClick={handleRunAudit} className="flex items-center gap-1.5 text-[9px] font-bold uppercase text-amber-400 hover:text-amber-300 transition-colors border border-amber-900/40 px-2.5 py-1 rounded bg-amber-950/20"><Icon name="shield" size={10} /> ✨ Code Audit</button>
                            <button onClick={() => setShowSynthModal(true)} className="flex items-center gap-1.5 text-[9px] font-bold uppercase text-purple-400 hover:text-purple-300 transition-colors border border-purple-900/40 px-2.5 py-1 rounded bg-purple-950/20"><Icon name="image" size={10} /> ✨ Asset Synth</button>
                            <button onClick={playBriefing} disabled={audioLoading} className={`flex items-center gap-1.5 text-[9px] font-bold uppercase transition-colors border px-2.5 py-1 rounded bg-black/50 ${activeAudio ? 'border-red-900 text-red-400' : 'border-[rgba(0,229,255,0.20)] text-gray-400'}`}><Icon name="volume" size={10} /> {activeAudio ? 'Stop Narrative' : '✨ Code Voiceover'}</button>
                            <button onClick={forceSave} className="flex items-center gap-1 text-[9px] font-bold uppercase text-[#67e8f9] hover:text-white transition-colors ml-1"><Icon name="save" size={10} /> Force Save</button>
                        </div>
                    </div>

                    <div className="bg-[#020202] border-b border-[rgba(0,229,255,0.20)]/40 px-4 py-3 shrink-0 flex flex-col gap-2.5 relative">
                        {chipsLoading && <div className="absolute inset-0 chip-shimmer pointer-events-none" />}
                        <div className="flex gap-2 overflow-x-auto pb-1 max-w-full relative">
                            {dynamicChips.map(chip => (
                                <button key={chip.id} onClick={() => runGeminiChip(chip.prompt, chip.label)} disabled={isGenerating || chipsLoading} className={`shrink-0 ${chip.dynamic ? 'bg-[#00e5ff]/15 border-[#67e8f9]/40' : 'bg-black/80 border-[rgba(0,229,255,0.20)]'} hover:bg-[#00e5ff]/20 border text-gray-300 px-3 py-1.5 rounded-lg text-[10px] font-medium transition-all flex items-center gap-1.5`}>{chip.label}</button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 relative bg-black min-h-0 flex flex-col">
                        <textarea className={`flex-grow w-full bg-black text-[#c9d1d9] p-6 mono text-xs md:text-sm resize-none focus:outline-none focus:ring-0 ${isGenerating ? 'opacity-40' : ''}`} value={code} onChange={(e) => setCode(e.target.value)} spellCheck={false} />
                        <div className="h-12 bg-[#0a0c10] border-t border-[rgba(0,229,255,0.20)] px-4 flex items-center gap-3 shrink-0">
                            <Icon name="sparkles" size={14} className="text-[#67e8f9]" />
                            <input type="text" className="flex-1 bg-black/40 text-xs text-white placeholder-gray-600 focus:outline-none py-1 px-2 rounded border border-[rgba(0,229,255,0.20)]/60" placeholder="Command Gemini to patch this file..." value={customIdea} onChange={(e) => setCustomIdea(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && customIdea.trim() !== "") { runGeminiChip(customIdea, customIdea.slice(0, 40)); setCustomIdea(""); } }} />
                            <button onClick={() => { if (customIdea.trim() !== "") { runGeminiChip(customIdea, customIdea.slice(0, 40)); setCustomIdea(""); } }} className="bg-[#0891b2] text-white px-3 py-1 rounded text-[9px] font-bold uppercase tracking-wider hover:bg-[#00e5ff]">Execute</button>
                        </div>
                    </div>

                    {showSynthModal && (
                        <div className="fixed inset-0 modal-backdrop z-[300] flex items-center justify-center p-4 fade-in font-sans">
                            <div className="bg-[#0a0c10] border border-purple-900/60 rounded-2xl w-full max-w-xl p-6 shadow-2xl relative">
                                <h3 className="text-sm font-black uppercase tracking-widest text-white mb-2 flex items-center gap-2"><Icon name="image" size={16} className="text-purple-400" /> ✨ Imagen UI Asset Synth</h3>
                                <textarea className="w-full h-24 bg-black border border-[rgba(0,229,255,0.20)] rounded-xl p-4 text-xs focus:outline-none text-white resize-none mb-4" placeholder="Describe your design asset..." value={synthPrompt} onChange={(e) => setSynthPrompt(e.target.value)} disabled={synthLoading} />
                                {synthLoading && <div className="flex flex-col items-center justify-center py-6 gap-3"><Icon name="loader" size={24} className="text-purple-400 animate-spin" /></div>}
                                {synthImage && (
                                    <div className="flex flex-col items-center border border-purple-950 bg-black/40 p-4 rounded-xl mb-4 gap-4">
                                        <img src={synthImage} className="max-h-48 rounded-lg shadow-xl" />
                                        <button onClick={injectImageToIDE} className="w-full h-10 bg-purple-700 text-white rounded-xl text-xs font-bold uppercase"><Icon name="check" size={14} /> ✨ Inject inline</button>
                                    </div>
                                )}
                                <div className="flex justify-end gap-3 pt-4"><button onClick={() => { setShowSynthModal(false); setSynthImage(null); }} className="text-[10px] font-bold uppercase text-gray-400 hover:text-white px-4 py-2">Close</button>{!synthImage && <button onClick={handleSynthAsset} disabled={synthLoading || !synthPrompt.trim()} className="bg-purple-800 hover:bg-purple-700 text-white px-5 py-2 rounded-xl text-[10px] font-bold uppercase">✨ Synth Asset</button>}</div>
                            </div>
                        </div>
                    )}

                    {showAuditModal && (
                        <div className="fixed inset-0 modal-backdrop z-[300] flex items-center justify-center p-4 fade-in font-sans">
                            <div className="bg-[#0a0c10] border border-amber-900/60 rounded-2xl w-full max-w-4xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <h3 className="text-sm font-black uppercase text-white mb-2 flex items-center gap-2"><Icon name="shield" size={16} className="text-amber-400" /> ✨ AI Code Threat Auditor</h3>
                                {auditLoading && <div className="flex justify-center py-20"><Icon name="loader" size={32} className="text-amber-400 animate-spin" /></div>}
                                {auditData && (
                                    <div className="space-y-6 py-4">
                                        <div className="flex items-center justify-between p-4 bg-amber-950/20 border border-amber-900/50 rounded-xl"><div><span className="text-[10px] uppercase font-bold text-gray-500">Overall Structural Safety</span><div className="text-3xl font-black text-amber-400">{auditData.overallScore} / 100</div></div></div>
                                        <div className="space-y-3">
                                            {auditData.findings?.map((finding, idx) => (
                                                <div key={idx} className="p-4 bg-black border border-[rgba(0,229,255,0.20)] rounded-xl flex gap-4">
                                                    <div className="flex flex-col gap-2 w-32"><span className="text-[8px] font-black px-2 py-0.5 rounded text-center bg-red-950 text-red-400">{finding.severity} RISK</span><span className="text-[9px] mono text-gray-500 text-center">{finding.category}</span></div>
                                                    <div className="flex-1 space-y-1"><h5 className="text-xs font-bold text-white">{finding.title}</h5><p className="text-xs text-gray-400">{finding.description}</p><pre className="text-[10px] bg-[#0a0c10] text-[#67e8f9] p-3 rounded-lg mono overflow-x-auto max-w-full">{finding.suggestedFix}</pre></div>
                                                </div>
                                            ))}
                                        </div>
                                        {auditData.securityPatch && <div className="pt-4"><button onClick={applyAuditPatch} className="w-full h-11 bg-amber-700 text-white rounded-xl text-xs font-bold uppercase"><Icon name="check" size={14} /> ✨ Apply Security Patch</button></div>}
                                    </div>
                                )}
                                <div className="flex justify-end pt-4"><button onClick={() => { setShowAuditModal(false); setAuditData(null); }} className="text-[10px] font-bold uppercase text-gray-400 hover:text-white px-5 py-2">Close Diagnostics</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ===== COMPONENT: AI FORGE MODAL (NEO-NEXUS INTEGRATION) =====
        const AIForgeModal = ({ open, busy, onClose, onGenerate, networkOnline }) => {
            const [idea, setIdea] = useState('');
            const [complexity, setComplexity] = useState('Standard');
            const [category, setCategory] = useState('Code');
            const [style, setStyle] = useState('Cyberpunk / Dark');
            const [extraInstructions, setExtraInstructions] = useState('');
            const [includeComments, setIncludeComments] = useState(true);
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                if (!busy) { setProgress(0); return; }
                let p = 0; const id = setInterval(() => { p = Math.min(95, p + Math.random() * 12); setProgress(p); }, 350);
                return () => clearInterval(id);
            }, [busy]);

            if (!open) return null;

            const submit = () => {
                if (!idea.trim() || busy || !networkOnline) return;
                onGenerate({ idea: idea.trim(), complexity, category, style, extraInstructions: extraInstructions.trim(), includeComments });
            };

            return (
                <div className="fixed inset-0 modal-backdrop z-[150] flex items-end sm:items-center justify-center sm:p-4 fade-in safe-x">
                    <div className="glass-xray border border-cyan-500/40 rounded-t-custom sm:rounded-custom w-full sm:max-w-2xl max-h-[92vh] overflow-y-auto shadow-2xl glow-cyan relative">
                        <div className="scan-line" />
                        <div className="p-4 sm:p-5 border-b border-cyan-500/20 flex items-center justify-between sticky top-0 glass-xray z-10">
                            <h3 className="text-sm font-black uppercase tracking-widest text-cyan-50 flex items-center gap-2 glow-text"><Icon name="sparkles" size={16} className="text-cyan-400" /> Gemini Prompt Engine</h3>
                            <button onClick={onClose} disabled={busy} className="tap-target text-gray-500 hover:text-white disabled:opacity-30 flex items-center justify-center"><Icon name="x" size={20} /></button>
                        </div>

                        {!networkOnline && <div className="mx-4 mt-4 p-3 bg-rose-950/30 text-rose-300 text-[10px] uppercase font-bold flex items-center gap-2"><Icon name="wifiOff" size={12} /> Network offline</div>}

                        <div className="p-4 sm:p-6 space-y-5">
                            <div><label className="text-[10px] font-bold text-cyan-500/70 uppercase block mb-2">Describe Your Tool</label><textarea value={idea} onChange={(e) => setIdea(e.target.value)} placeholder="e.g. A tool that..." className="w-full h-24 bg-black/60 border border-cyan-500/20 focus:border-cyan-400 angular-cut-sm px-3 py-2 text-sm text-white outline-none resize-y mono" /></div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div><label className="text-[10px] font-bold text-cyan-500/70 uppercase block mb-2">Category</label><select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full bg-black/60 border border-cyan-500/20 angular-cut-sm px-3 py-2.5 text-sm text-white outline-none">{CATEGORY_LIST.map(c => <option key={c}>{c}</option>)}</select></div>
                                <div><label className="text-[10px] font-bold text-cyan-500/70 uppercase block mb-2">Complexity</label><select value={complexity} onChange={(e) => setComplexity(e.target.value)} className="w-full bg-black/60 border border-cyan-500/20 angular-cut-sm px-3 py-2.5 text-sm text-white outline-none"><option>Minimal</option><option>Standard</option><option>Advanced</option></select></div>
                                <div><label className="text-[10px] font-bold text-cyan-500/70 uppercase block mb-2">Style</label><select value={style} onChange={(e) => setStyle(e.target.value)} className="w-full bg-black/60 border border-cyan-500/20 angular-cut-sm px-3 py-2.5 text-sm text-white outline-none"><option>Cyberpunk / Dark</option><option>Minimal</option></select></div>
                            </div>
                            <div><label className="text-[10px] font-bold text-cyan-500/70 uppercase block mb-2">Extra Instructions</label><textarea value={extraInstructions} onChange={(e) => setExtraInstructions(e.target.value)} className="w-full h-16 bg-black/60 border border-cyan-500/20 angular-cut-sm px-3 py-2 text-xs text-white outline-none resize-y mono" /></div>
                            
                            {busy && (
                                <div className="pt-2">
                                    <div className="flex justify-between text-[9px] uppercase font-bold text-cyan-500/70 mb-2"><span className="flex items-center gap-2"><Icon name="loader" size={11} /> Synthesizing via Gemini</span><span className="text-cyan-300">{Math.round(progress)}%</span></div>
                                    <div className="h-1 bg-cyan-950 angular-cut-sm overflow-hidden"><div className="h-full bg-cyan-400 transition-all duration-300" style={{ width: progress + '%' }} /></div>
                                </div>
                            )}
                        </div>

                        <div className="p-4 sm:p-5 border-t border-cyan-500/20 flex justify-between sticky bottom-0 glass-xray z-10 safe-bottom">
                            <div className="text-[9px] text-cyan-700 uppercase tracking-widest hidden sm:flex items-center gap-2"><Icon name="zap" size={11} className="text-cyan-400" /> Cached</div>
                            <div className="flex items-center gap-3 ml-auto">
                                <button onClick={onClose} disabled={busy} className="tap-target text-[10px] font-bold text-gray-400 hover:text-white px-4 py-2 disabled:opacity-40 uppercase">Cancel</button>
                                <button onClick={submit} disabled={busy || !idea.trim() || !networkOnline} className="tap-target bg-cyan-500 text-black px-5 py-2.5 angular-cut-sm text-[10px] font-black uppercase flex items-center gap-2 glow-cyan disabled:opacity-40">{busy ? <><Icon name="loader" size={12} /> Forging…</> : <><Icon name="sparkles" size={12} /> Forge Tool</>}</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ===== TOOL CARD COMPONENT =====
        const ToolCard = ({ tool, onTap, onLongPress }) => {
            const pressTimer = useRef(null);
            const handleDown = () => { if (onLongPress) pressTimer.current = setTimeout(() => onLongPress(tool), 550); };
            const handleUp = () => { if (pressTimer.current) clearTimeout(pressTimer.current); };
            const critical = tool.stats?.power > 70;

            return (
                <div onClick={() => onTap(tool)} onMouseDown={handleDown} onMouseUp={handleUp} onMouseLeave={handleUp} onTouchStart={handleDown} onTouchEnd={handleUp} className="tool-card angular-cut p-6 flex flex-col h-full relative overflow-hidden cursor-pointer group">
                    <div className="absolute top-0 right-0 w-24 h-24 bg-cyan-500/10 blur-[60px] opacity-0 group-hover:opacity-100 transition-opacity" />
                    <div className="absolute bottom-0 left-0 w-1 h-0 group-hover:h-full bg-cyan-400 transition-all duration-500" />

                    <div className="flex justify-between items-start mb-6">
                        <div className={`w-12 h-12 ${tool.color} angular-cut-sm flex items-center justify-center text-white transition-all group-hover:rotate-6`}><Icon name={tool.icon} size={22} /></div>
                        <div className="text-right"><span className="text-[8px] font-black tracking-widest text-cyan-500 uppercase block mb-1">{tool.category}</span><span className="text-[10px] text-white/20 mono">#{String(tool.serial || 0).padStart(4, '0')}</span></div>
                    </div>

                    <h3 className="text-lg font-black text-white mb-2 uppercase tracking-tight group-hover:text-cyan-400 transition-colors italic line-clamp-2">{tool.name}</h3>
                    <p className="text-cyan-100/40 text-[11px] leading-relaxed mb-6 flex-grow tracking-wide font-medium line-clamp-3">{tool.description}</p>

                    <div className="space-y-3 mb-6">
                        <div className="flex items-center justify-between text-[8px] font-black uppercase text-cyan-700"><span className="tracking-widest">Load Complexity</span><span className={critical ? 'text-rose-400' : 'text-cyan-500'}>{critical ? 'CRITICAL' : 'STABLE'}</span></div>
                        <div className="flex gap-1 h-1">{Array.from({ length: 8 }).map((_, i) => (<div key={i} className={`flex-1 angular-cut-sm ${i < Math.round((tool.stats?.power || 50) / 12) ? 'bg-cyan-500 shadow-[0_0_5px_#00e5ff]' : 'bg-cyan-950'}`} />))}</div>
                    </div>

                    <div className="flex items-center justify-between mt-auto pt-4 border-t border-white/5">
                        <div className="flex items-center gap-2"><div className="w-1.5 h-1.5 bg-cyan-500 rounded-full animate-pulse" /><span className="text-[10px] font-black text-cyan-400">{tool.rating} RANK</span></div>
                        <div className="flex items-center gap-1 text-white font-black text-[9px] uppercase tracking-[0.2em] group-hover:text-cyan-400 transition-all">EXTRACT <Icon name="chevronRight" size={11} /></div>
                    </div>
                    {tool.source === 'ai' && <div className="absolute top-2 right-2 px-2 py-0.5 bg-cyan-500/10 border border-cyan-500/30 angular-cut-sm"><span className="text-[8px] font-black uppercase text-cyan-400 flex items-center gap-1"><Icon name="sparkles" size={9} /> AI</span></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
